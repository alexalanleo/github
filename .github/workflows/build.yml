name: Build Unsigned IPA

  on:
    push:
      branches: [ main ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: macos-15
      timeout-minutes: 60

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Select Xcode
          run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

        - name: Show Xcode version
          run: xcodebuild -version

        - name: Resolve dependencies
          run: |
            xcodebuild -resolvePackageDependencies \
              -project controller.xcodeproj \
              -scheme controller

        - name: Build (unsigned)
          run: |
            xcodebuild build \
              -project controller.xcodeproj \
              -scheme controller \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath build/ \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              PRODUCT_BUNDLE_IDENTIFIER=com.controller.app \
              | xcpretty || true

        - name: Package unsigned IPA
          run: |
            APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
            echo "Found app: $APP_PATH"

            mkdir -p Payload
            cp -r "$APP_PATH" Payload/

            # Strip any existing signatures
            codesign --remove-signature "Payload/$(basename $APP_PATH)" 2>/dev/null || true
            find "Payload/$(basename $APP_PATH)" -name "*.dylib" -o -name "*.framework" | while read f; do
              codesign --remove-signature "$f" 2>/dev/null || true
            done

            zip -r controller.ipa Payload/
            echo "IPA size: $(du -sh controller.ipa | cut -f1)"

        - name: Upload IPA artifact
          uses: actions/upload-artifact@v4
          with:
            name: controller-unsigned-${{ github.sha }}
            path: controller.ipa
            retention-days: 30

        - name: Upload to release (on tag)
          if: startsWith(github.ref, 'refs/tags/')
          uses: softprops/action-gh-release@v2
          with:
            files: controller.ipa
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  